[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "robovac-rl"
version = "0.1.0"
description = "Gymnasium environment for RoboVAC re-clean decisions"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
dependencies = ["gymnasium>=1.0,<2", "numpy>=1.24", "PyYAML>=6", "scipy>=1.10"]

[project.optional-dependencies]
train = ["stable-baselines3==2.8.0", "sb3-contrib==2.8.0"]
test = ["pytest>=8"]

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
where = ["src"]
namespaces = false

[tool.setuptools.package-data]
vacuum_rl = ["data/*.pgm", "data/*.yaml"]
